<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | EcoSmart Waste Management</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="icon" href="Green Website Icon on Gradient Square (1).png">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      background: linear-gradient(135deg, #2e7d32, #4caf50);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }
    .container-404 {
      max-width: 600px;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      animation: fadeIn 1s ease;
    }
    .container-404 img {
      height: 80px;
      margin-bottom: 1rem;
    }
    .container-404 h1 {
      font-size: 4rem;
      margin-bottom: .5rem;
    }
    .container-404 h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .btn-home {
      background: #ffffff;
      color: #2e7d32;
      font-weight: bold;
      padding: .75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
      margin-top: 1rem;
    }
    .btn-home:hover {
      background: #c8e6c9;
    }
    .search-box {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
    }
    .search-box input {
      padding: .5rem;
      border-radius: 8px 0 0 8px;
      border: none;
      width: 70%;
    }
    .search-box button {
      background: #fff;
      color: #2e7d32;
      border: none;
      padding: .5rem 1rem;
      font-weight: bold;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
    }
    .search-box button:hover {
      background: #c8e6c9;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container-404">
    <img src="Green Website Icon on Gradient Square (1).png" alt="EcoSmart Logo">
    <h1>404</h1>
    <h2>Oops! We couldn’t find that page.</h2>
    <p>The page you’re looking for might have been moved or deleted.</p>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search EcoSmart…">
      <button onclick="searchSite()">Search</button>
    </div>

    <a href="index.html" class="btn-home">🏠 Back to Home</a>
  </div>

  <script>
    function searchSite(){
      const query = document.getElementById('searchInput').value.trim();
      if(query){
        // redirect to Google search with site filter or your own search page
        window.location.href = `https://www.google.com/search?q=site:${window.location.origin} ${encodeURIComponent(query)}`;
      }
    }
  </script>
</body>
</html>
